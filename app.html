<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI App – Joke Generator</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <style>
        .joke-container {
            text-align: center;
            padding: 2rem;
        }
        .joke-container button {
            padding: 10px 20px;
            font-size: 1.2rem;
            border: none;
            background-color: #0085A1;
            color: white;
            border-radius: 5px;
        }
        .joke-container button:hover {
            background-color: #006a80;
        }
        .joke-text {
            margin-top: 20px;
            font-size: 1.25rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light" id="mainNav">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="index.html">MySite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
                Menu <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto py-4 py-lg-0">
                    <li class="nav-item"><a class="nav-link px-lg-3 py-3 py-lg-4" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link px-lg-3 py-3 py-lg-4" href="scratch.html">Scratch</a></li>
                    <li class="nav-item"><a class="nav-link px-lg-3 py-3 py-lg-4" href="app.html">App</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="masthead" style="background-image: url('assets/img/home-bg.jpg')">
        <div class="container position-relative px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <div class="page-heading text-center">
                        <h1>Joke Generator</h1>
                        <span class="subheading">A mini AI-powered web app</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- App Content -->
    <main class="joke-container">
        <h2>Need a laugh?</h2>
        <button onclick="newJoke()">Tell me a joke</button>
        <div class="joke-text" id="jokeDisplay">Click the button to hear a joke.</div>
    </main>

    <!-- Footer -->
    <footer class="border-top">
        <div class="container px-4 px-lg-5">
            <div class="text-center small text-muted fst-italic">Copyright &copy; MySite 2025</div>
        </div>
    </footer>

    <script>
        const jokes = [
            "Why don’t skeletons fight each other? They don’t have the guts.",
            "I told my wife she was drawing her eyebrows too high. She looked surprised.",
            "I’m on a seafood diet. I see food and I eat it.",
            "Why don’t scientists trust atoms? Because they make up everything!"
        ];
        function newJoke() {
            const random = Math.floor(Math.random() * jokes.length);
            document.getElementById('jokeDisplay').innerText = jokes[random];
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
